services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ravms-db
    environment:
      POSTGRES_USER: ravms
      POSTGRES_PASSWORD: ravms123
      POSTGRES_DB: ravms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
